<html>

<head>
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <header>
        <nav class="navbar navbar-expand-lg bg-white">
            <div class="container">
                <a class="navbar-brand" href="#">
                    <div class="d-flex align-items-center justify-content-center">
                        <span class="me-3 rounded-4 book text-white"><i class="fa-solid fa-address-book"></i></span>
                        <div class="icon">
                            <h2 class="m-0 fs-4 fw-bold">Contact<span>Hub</span></h2>
                            <p class="m-0 fw-medium main-color">Smart Contact Manager</p>
                        </div>
                    </div>
                </a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                    data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent"
                    aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarSupportedContent">
                    <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
                        <li class="nav-item">
                            <button type="button" class="btn btn-primary" data-bs-toggle="modal"
                                data-bs-target="#exampleModal">
                                + Add Contact
                            </button>

                            <!-- Modal -->
                            <div class="modal fade" id="exampleModal" tabindex="-1" aria-labelledby="exampleModalLabel"
                                aria-hidden="true">
                                <div class="modal-dialog modal-dialog-centered">
                                    <div class="modal-content">
                                        <div class="modal-header">
                                            <h1 class="modal-title fs-5" id="exampleModalLabel">Add New Contact</h1>
                                            <button type="button" class="btn-close" data-bs-dismiss="modal"
                                                aria-label="Close"></button>
                                        </div>
                                        <div class="modal-body">
                                            <form id="contactForm">
                                                <!-- Contact Photo -->
                                                <div class="contact-photo-section">
                                                    <div class="contact-photo-preview">
                                                        <i class="fas fa-user"></i>
                                                    </div>
                                                    <label for="photoInput" class="btn btn-secondary btn-sm"
                                                        id="changePhotoBtn">
                                                        <i class="fas fa-camera"></i> Change Photo
                                                    </label>
                                                    <input type="file" id="photoInput" accept="image/*"
                                                        style="display: none">
                                                </div>
                                                <div class="form-group mb-3">
                                                    <label for="fullName">Full Name <span
                                                            class="text-danger">*</span></label>
                                                    <input type="text" class="form-control" id="fullName"
                                                        placeholder="Enter full name" required />
                                                </div>
                                                <div class="form-group mb-3">
                                                    <label for="phoneNumber">Phone Number <span
                                                            class="text-danger">*</span></label>
                                                    <input type="tel" class="form-control" id="phoneNumber"
                                                        placeholder="e.g., 01012345678" required />
                                                </div>
                                                <div class="form-group mb-3">
                                                    <label for="emailAddress">Email Address</label>
                                                    <input type="email" class="form-control" id="emailAddress"
                                                        placeholder="name@example.com" />
                                                </div>
                                                <div class="form-group">
                                                    <label for="address">Address</label>
                                                    <input type="text" class="form-control" id="address"
                                                        placeholder="Enter address" />
                                                </div>
                                                <div class="form-group mb-3">
                                                    <label for="group">Group</label>
                                                    <select class="form-control" id="group">
                                                        <option value="">Select a group</option>
                                                        <option value="family">Family</option>
                                                        <option value="friends">Friends</option>
                                                        <option value="work">Work</option>
                                                        <option value="school">School</option>
                                                        <option value="other">Other</option>
                                                    </select>
                                                </div>
                                                <div class="form-group mb-3">
                                                    <label for="notes">Notes</label>
                                                    <textarea class="form-control" id="notes" rows="3"
                                                        placeholder="Add notes about this contact"></textarea>
                                                </div>
                                                <div class="form-checkboxes d-flex gap-4">
                                                    <div class="form-check">
                                                        <input class="form-check-input" type="checkbox"
                                                            id="isFavorite" />
                                                        <label class="form-check-label" for="isFavorite">
                                                            <i class="fas fa-star text-warning"></i> Favorite
                                                        </label>
                                                    </div>
                                                    <div class="form-check">
                                                        <input class="form-check-input" type="checkbox"
                                                            id="isEmergency" />
                                                        <label class="form-check-label" for="isEmergency">
                                                            <i class="fas fa-heartbeat text-danger"></i> Emergency
                                                        </label>
                                                    </div>
                                                </div>
                                            </form>
                                        </div>
                                        <div class="modal-footer">
                                            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal"
                                                id="cancelContactBtn">Cansel</button>
                                            <button onclick="saveContact()" type="button" class="btn btn-primary"
                                                id="saveContactBtn">Save Contact</button>
                                            <button onclick="getContactForUpdate()" id="updateContactBtn" class="d-none"
                                                type="button">Update Contact</button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link mt-2" href="#"><i class="fa-solid fa-bell main-color"></i></a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link mt-2" href="#"><i class="fa-solid fa-gear main-color"></i></a>
                        </li>
                        <li class="nav-item">
                            <img src="Images/avatar-4.jpg" alt="Admin Photo" class="photo rounded-3">
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>
    <main>
        <section>
            <div class="container dashboard-cards">
                <div class="row g-3">
                    <div class="col-md-4">
                        <div class="stat-card stat-total">
                            <div class="stat-icon">
                                <i class="fas fa-users"></i>
                            </div>
                            <div class="stat-info">
                                <div class="stat-label">TOTAL</div>
                                <div class="stat-value" id="totalContacts">0</div>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="stat-card stat-favorites">
                            <div class="stat-icon">
                                <i class="fas fa-star"></i>
                            </div>
                            <div class="stat-info">
                                <div class="stat-label">FAVORITES</div>
                                <div class="stat-value" id="favoritesCount">0</div>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="stat-card stat-emergency">
                            <div class="stat-icon">
                                <i class="fas fa-heartbeat"></i>
                            </div>
                            <div class="stat-info">
                                <div class="stat-label">EMERGENCY</div>
                                <div class="stat-value" id="emergencyCount">0</div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

        </section>
        <section>
            <div class="container">
                <div class="row">
                    <!-- Left Side - All Contacts -->
                    <div class="col-lg-8">
                        <div class="p-2">
                            <div>
                                <h2 class="fs-2 fw-bold mb-1">All Contacts</h2>
                                <p class="text-secondary mb-3">
                                    Manage and organize your
                                    <span id="contactsCount">2</span> contacts
                                </p>
                            </div>
                            <div class="search-bar position-relative mb-2">
                                <i class="fas fa-search position-absolute text-secondary"></i>
                                <input type="text" placeholder="Search contacts..." id="searchInput"
                                    oninput="searchContacts(this.value)" class="w-100 bg-white ps-5 py-3 rounded-3">
                            </div>
                            <div id="contactsList">
                                <div class="row g-4" id="contactList">
                                </div>
                            </div>
                        </div>
                    </div>
                    <!-- Right Side - Sidebar -->
                    <div class="col-lg-4">
                        <div class="d-flex flex-column gap-2">
                            <!-- Favorites Section -->
                            <div class="sidebar-section bg-white border-0 rounded-3">
                                <div class="sidebar-header fav d-flex align-items-center mb-2 gap-2 p-3">
                                    <i class="fas fa-star"></i>
                                    <div>
                                        <h3 class="fw-bold fs-5 m-0">Favorites</h3>
                                        <p class="sidebar-subtitle">Quick access to starred contacts</p>
                                    </div>
                                </div>
                                <div class="d-flex flex-column gap-2 p-3" id="favoritesList">
                                </div>
                            </div>
                            <!-- Emergency Section -->
                            <div class="sidebar-section bg-white border-0 rounded-3">
                                <div class="sidebar-header emergy d-flex align-items-center mb-2 gap-2 p-3">
                                    <i class="fas fa-heartbeat"></i>
                                    <div>
                                        <h3 class="fw-bold fs-5 m-0">Emergency</h3>
                                        <p class="sidebar-subtitle">Important contacts for urgent calls</p>
                                    </div>
                                </div>
                                <div class="d-flex flex-column gap-2 p-3" id="emergencyList">
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>
    <script src="js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="js/index.js"></script>
</body>

</html>
